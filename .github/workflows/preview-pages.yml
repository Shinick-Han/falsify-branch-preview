name: Publish Falsify branch preview
on:
  push:
    branches: [feat/workbench-html-guide-20261012]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-pages
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser contracts (no model calls)
        working-directory: tools/workbench/app
        run: node scripts/test.mjs
      - name: Standalone guide contracts
        working-directory: tools/workbench/app
        run: node tests/guide.spec.cjs
      - name: Package only tracked static files
        run: node scripts/prepare-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
